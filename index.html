<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site oficial do aplicativo Me Avise">
  <title>Me Avise</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111216;
      color: #f5f3f9;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: 48px 0;
    }
    h1 { margin-bottom: 8px; }
    p { line-height: 1.65; }
    a { color: #c8a9ff; }
    .card {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #35313f;
      border-radius: 16px;
      background: #19181e;
    }
    @media (prefers-color-scheme: light) {
      body { background: #ffffff; color: #1d1b20; }
      .card { background: #f7f3fb; border-color: #e2dbea; }
      a { color: #6650a4; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Me Avise</h1>
    <p>Me Avise é um organizador pessoal para criar e acompanhar lembretes, rotinas e compromissos no Android.</p>

    <div class="card">
      <p><strong>Privacidade:</strong> consulte a política pública do aplicativo.</p>
      <p><a href="https://lanajuliana1987.github.io/me-avise-privacy/">Política de Privacidade do Me Avise</a></p>
      <p><strong>Suporte:</strong> <a href="mailto:meavise.app@gmail.com">meavise.app@gmail.com</a></p>
    </div>
  </main>
</body>
</html>
